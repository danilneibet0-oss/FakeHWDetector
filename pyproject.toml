[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fakehwdetector"
version = "0.1.0"
description = "Hardware Authenticity Checker"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.5", "PyYAML>=6.0"]

[project.optional-dependencies]
ui = ["PySide6>=6.6"]
dev = ["pytest>=8", "pytest-qt>=4"]

[project.scripts]
fakehw = "fakehw.cli:main"

[tool.setuptools.packages.find]
include = ["fakehw*"]

[tool.setuptools.package-data]
"fakehw.rules" = ["rules/*.yaml"]
"fakehw.kb" = ["data/*.ids", "data/snapshot.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
